# Fly.io app config. Run `fly launch --no-deploy` first to claim an app name,
# then edit the app name below if Fly assigned a different one.
app = "tifo-maker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"
