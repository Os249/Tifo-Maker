name: CI

on:
  push:
  pull_request:
  # New advisories are published whether or not anyone pushes, so the
  # dependency and secret checks also run every Monday morning.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only unless a job asks for more. Every job below runs third-party code
# (npm packages and their install scripts); with a read/write token, one bad
# package could push to main, and Railway deploys main.
permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    # Real Postgres so the pg + social paths run in CI. The memory-only suite
    # missed a JSONB round-trip bug in remix; this prevents that class of bug.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tifo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tifo_test

    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other
      # code after the fact, a commit cannot. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config while npm runs install scripts.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies (exactly the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Apply database schema
        run: psql "$DATABASE_URL" -f server/schema.sql

      - name: Typecheck + build
        run: npm run build

      - name: Server tests (Postgres + social)
        run: npm run test:server

      - name: Security regression tests
        run: npm run test:security

      - name: Security operations (SOC) tests
        run: npm run test:soc

      - name: Email tests
        run: npm run test:email

      - name: Deployment checks (Node support window, image, CI)
        run: npm run test:deploy

      # Pro: allowances, the gift, the price question, the admin's grants;
      # the store-level checks run on the Postgres service above.
      - name: Pro tests (Postgres)
        run: npm run test:pro

      # AI Critique: what is kept of the critic's answer, the two routes and
      # their counters (the model is a stand-in), and the typed fix operations
      # with their undo.
      - name: AI review tests
        run: npm run test:review

      - name: Fix operation checks
        run: npm run verify:fixops

      # Buying Pro: v1 (the hosted invoice), then v2 (the proxy, the payment
      # form, the webhook-only mode, auto-renew and its races). Both against a
      # fake Moyasar; the stores' locks run on the Postgres service above.
      - name: Payment tests (Postgres)
        run: npm run test:payments

      - name: Payment tests v2 (Postgres)
        run: npm run test:payments2

      # Refunds told to the fan (the email once, the notice once), refund
      # requests with approve, decline and the auto-refund switch, purchases.
      - name: "Payment tests v3: refunds and purchases (Postgres)"
        run: npm run test:payments3

      # The launch: the price by date, the launch moment and the founders
      # list, the one founders email, and the founders bonus under races.
      - name: "Launch tests: price, founders, bonus (Postgres)"
        run: npm run test:launch

      # The turnaround: the monthly price as a setting, the match pass, the
      # automatic 7 days and their three emails, every switch off by default.
      - name: "Turnaround tests: price setting, match pass, automatic gift, emails (Postgres)"
        run: npm run test:turnaround

      - name: Club kit tests (Postgres)
        run: npx tsx server/test/kits.test.mts

      # Tifo events: one event from draft to result, and the store on Postgres.
      - name: Tifo event tests (Postgres)
        run: npm run test:events

      - name: Image tests
        run: npm run test:images

      - name: Growth server tests
        run: npm run test:growth-server

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: No credentials in tracked files
        run: node scripts/secret-scan.mjs

      # Production packages only: the dev toolchain (Vite, esbuild) never runs
      # on the server. Reads the lockfile, so nothing is installed or executed.
      - name: No known high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high --package-lock-only