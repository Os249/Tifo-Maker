<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Community · TifoMaker</title>
  <meta name="description" content="Discover, like, comment on, and remix stadium tifo designs from supporters around the world." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/community.css" />
  <style>
    /* The server-rendered link list. Real, visible content: it is what a crawler
       and a no-JS visitor get, and it is removed the moment the interactive grid
       renders. Styled as a plain thumbnail list so the brief moment it is on
       screen looks deliberate rather than broken. */
    .seo-feed ul { list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .seo-feed li { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px; overflow: hidden; }
    .seo-feed a { display: block; color: inherit; text-decoration: none; }
    .seo-feed img { display: block; width: 100%; height: auto; }
    .seo-feed span { display: block; padding: 10px 12px 2px; font-weight: 600; }
    .seo-feed small { display: block; padding: 0 12px 10px; opacity: .6; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">TIFO<b>MAKER</b></a>
    <nav class="nav-links">
      <a href="/community" class="active" data-i18n="nav.community">Community</a>
      <a href="/app" data-i18n="nav.openEditor">Open the editor</a>
      <button class="lang-toggle" id="lang-toggle" data-i18n="common.language">العربية</button>
      <button class="icon-btn notif-btn" id="notif-btn" title="Notifications" hidden>
        <i class="ti ti-bell"></i><span class="notif-dot" id="notif-dot" hidden></span>
      </button>
      <button class="nav-cta" id="auth-btn">Sign in</button>
    </nav>
  </header>

  <main class="community">
    <section class="hub-head">
      <div class="hub-head-inner">
        <h1 data-i18n="community.title">The tifo community</h1>
        <p class="hub-sub" data-i18n="community.sub">Discover displays from supporters worldwide. Like, comment, follow creators, and remix any tifo into your own.</p>
        <div class="hub-controls">
          <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="text" id="user-search" placeholder="Search creators by @username…" autocomplete="off" />
            <div class="search-results" id="search-results" hidden></div>
          </div>
          <div class="sort-tabs" id="sort-tabs">
            <button class="sort-tab active" data-sort="recent" data-i18n="community.recent">Recent</button>
            <button class="sort-tab" data-sort="likes" data-i18n="community.popular">Most liked</button>
            <button class="sort-tab" data-sort="templates" data-i18n="community.templates">Templates</button>
          </div>
        </div>
        <div class="tag-row" id="tag-row"></div>
      </div>
    </section>

    <section class="grid-wrap">
      <div class="gallery-grid" id="gallery-grid"></div>
      <div class="grid-empty" id="grid-empty" hidden>
        <i class="ti ti-mood-empty"></i>
        <p>No tifos here yet. Be the first to publish one!</p>
        <a class="btn btn-primary" href="/app">Open the editor</a>
      </div>
      <div class="grid-loading" id="grid-loading">Loading the community feed…</div>
    </section>
  </main>

  <!-- 3D preview modal mount (filled by community.ts) -->
  <div class="modal-root" id="modal-root" hidden></div>
  <!-- notifications panel mount -->
  <div class="notif-panel" id="notif-panel" hidden></div>
  <!-- auth modal mount -->
  <div id="auth-mount"></div>

  <footer class="site-foot">
    <a href="/" data-i18n="clubs.footHome">Home</a>
    <a href="/legal#terms" data-i18n="nav.terms">Terms</a>
    <a href="/legal#privacy" data-i18n="nav.privacy">Privacy</a>
    <a href="https://x.com/OS99GameDev" target="_blank" rel="noopener noreferrer" data-i18n="foot.contact">Contact the dev</a>
  </footer>

  <script type="module" src="/src/community.ts"></script>
</body>
</html>
