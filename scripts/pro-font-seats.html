<!doctype html>
<!-- Dev-only harness for scripts/pro-font-seats.mts. Not a Vite build input. -->
<html lang="en"><head><meta charset="UTF-8" /><title>pro font seats</title></head>
<body style="margin:0;background:#111"><div id="out">loading…</div>
<script type="module">
  import { loadTifoFonts, loadProFonts } from '/src/core/tifoFonts.ts';
  import { TIFO_FONTS, fontCssOf, renderTextCanvas } from '/src/core/text.ts';
  import { drawSeatAlpha, MAX_GROW_ROWS } from '/src/core/seatText.ts';
  import { generateSeatMap, EDITOR_UNITS } from '/src/core/seatmap.ts';
  import { templateById } from '/src/core/stadiumCatalog.ts';
  import { stampObject } from '/src/core/layers.ts';
  import { standIndexOfU } from '/src/core/tifoSpec.ts';
  import { gridSize } from '/src/core/objects.ts';
  import { newBanner, aspectOf } from '/src/core/banner.ts';
  import { bannerToCanvas } from '/src/render/bannerRender.ts';

  const css = (family) => `"${family}", "Arial Black", sans-serif`;
  /** A family's CSS: a product voice id, or a candidate's family. */
  const cssFor = (f) => (f.voice ? fontCssOf(f.voice) : css(f.family));

  window.__faces = async (list) => {
    await loadTifoFonts();
    await loadProFonts();
    for (const f of list) {
      for (const [url, ar] of [[f.ar, true], [f.lat, false]]) {
        if (!url) continue;
        const face = new FontFace(f.family, `url(${url})`, ar ? { unicodeRange: 'U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F' } : {});
        try { document.fonts.add(await face.load()); } catch (e) { console.error('face', f.family, url, String(e)); }
      }
    }
    await document.fonts.ready;
    return [...document.fonts].filter((x) => x.status === 'loaded').length;
  };

  // ---- topology on a 0/1 grid (4-connected) --------------------------------
  function comps(mask, w, h, val, minArea) {
    const lab = new Int32Array(w * h).fill(-1);
    const out = [];
    const st = [];
    for (let i = 0; i < w * h; i++) {
      if (mask[i] !== val || lab[i] >= 0) continue;
      let area = 0, border = false;
      st.push(i); lab[i] = out.length;
      while (st.length) {
        const j = st.pop(); area++;
        const x = j % w, y = (j / w) | 0;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) border = true;
        for (const k of [x > 0 ? j - 1 : -1, x < w - 1 ? j + 1 : -1, y > 0 ? j - w : -1, y < h - 1 ? j + w : -1]) {
          if (k >= 0 && mask[k] === val && lab[k] < 0) { lab[k] = out.length; st.push(k); }
        }
      }
      out.push({ area, border });
    }
    return out.filter((c) => c.area >= minArea);
  }
  /** Labels of a mask's pieces of value `val` (4-connected): lab[i] = piece or -1, and each piece's area. */
  function label(mask, w, h, val) {
    const lab = new Int32Array(w * h).fill(-1);
    const area = [];
    const border = [];
    const st = [];
    for (let i = 0; i < w * h; i++) {
      if (mask[i] !== val || lab[i] >= 0) continue;
      const id = area.length;
      let a = 0, b = false;
      st.push(i); lab[i] = id;
      while (st.length) {
        const j = st.pop(); a++;
        const x = j % w, y = (j / w) | 0;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) b = true;
        if (x > 0 && mask[j - 1] === val && lab[j - 1] < 0) { lab[j - 1] = id; st.push(j - 1); }
        if (x < w - 1 && mask[j + 1] === val && lab[j + 1] < 0) { lab[j + 1] = id; st.push(j + 1); }
        if (y > 0 && mask[j - w] === val && lab[j - w] < 0) { lab[j - w] = id; st.push(j - w); }
        if (y < h - 1 && mask[j + w] === val && lab[j + w] < 0) { lab[j + w] = id; st.push(j + w); }
      }
      area.push(a); border.push(b);
    }
    return { lab, area, border };
  }
  /**
   * The seats against the face as drawn, piece by piece: each piece of the
   * letters at 128px (a letter, a dot, a hamza; specks under minPiece px left
   * out) is found in the seats or not (lost), in one piece or several
   * (broken), on its own or welded to another (merged); and the counters big
   * enough for seats (minHole px, two cells' worth) are open or not.
   */
  function compare(hi, W, H, grid, cols, rows, minPiece, minHole) {
    const P = label(hi, W, H, 1);
    const keepP = P.area.map((a) => a >= minPiece);
    const G = label(grid, cols, rows, 1);
    // Each seat's piece of the face: the one covering most of its cell.
    const sx = W / cols, sy = H / rows;
    const gToP = G.area.map(() => new Set());
    const pToG = P.area.map(() => new Set());
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const gi = G.lab[y * cols + x];
      if (gi < 0) continue;
      const votes = new Map();
      for (let yy = Math.floor(y * sy); yy < Math.min(H, Math.ceil((y + 1) * sy)); yy++)
        for (let xx = Math.floor(x * sx); xx < Math.min(W, Math.ceil((x + 1) * sx)); xx++) {
          const p = P.lab[yy * W + xx];
          if (p >= 0 && keepP[p]) votes.set(p, (votes.get(p) ?? 0) + 1);
        }
      let best = -1, n = 0;
      for (const [p, c] of votes) if (c > n) { n = c; best = p; }
      if (best >= 0) { gToP[gi].add(best); pToG[best].add(gi); }
    }
    let lost = 0, broken = 0, pieces = 0;
    P.area.forEach((a, p) => {
      if (!keepP[p]) return;
      pieces++;
      if (!pToG[p].size) lost++;
      else {
        // Broken: two or more seat pieces that are this face piece alone.
        let own = 0;
        for (const g of pToG[p]) if (gToP[g].size === 1 && G.area[g] >= 2) own++;
        if (own >= 2) broken++;
      }
    });
    let merged = 0;
    for (const s of gToP) if (s.size >= 2) merged += s.size - 1;
    const B = label(hi, W, H, 0);
    const wantHoles = B.area.filter((a, i) => !B.border[i] && a >= minHole).length;
    const GB = label(grid, cols, rows, 0);
    const gotHoles = GB.area.filter((a, i) => !GB.border[i]).length;
    return { pieces, lost, broken, merged, wantHoles, gotHoles };
  }
  /** Seats in strokes under 3 seats across or 2 rows up (core/seatText's minimum). */
  function thinShare(mask, w, h) {
    let n = 0, f = 0;
    const run = (i, dx, dy, cap) => {
      let r = 1; const x0 = i % w, y0 = (i / w) | 0;
      for (const s of [-1, 1]) { let x = x0 + s * dx, y = y0 + s * dy; while (x >= 0 && y >= 0 && x < w && y < h && mask[y * w + x] && r < cap) { r++; x += s * dx; y += s * dy; } }
      return r;
    };
    for (let i = 0; i < w * h; i++) { if (!mask[i]) continue; n++; if (run(i, 1, 0, 3) < 3 || run(i, 0, 1, 2) < 2) f++; }
    return n ? f / n : 1;
  }
  /** Seats in strokes thinner than 3 either way (core/analysis on a grid). */
  function fragile(mask, w, h) {
    let n = 0, f = 0;
    const run = (i, dx, dy) => {
      let r = 1; const x0 = i % w, y0 = (i / w) | 0;
      for (const s of [-1, 1]) { let x = x0 + s * dx, y = y0 + s * dy; while (x >= 0 && y >= 0 && x < w && y < h && mask[y * w + x] && r < 3) { r++; x += s * dx; y += s * dy; } }
      return r;
    };
    for (let i = 0; i < w * h; i++) {
      if (!mask[i]) continue;
      n++;
      if (run(i, 1, 0) < 3 || run(i, 0, 1) < 3) f++;
    }
    return { painted: n, fragile: f };
  }
  /** The thinnest strokes up: the 10th percentile of each column's ink runs, in rows. */
  function thinUp(mask, w, h) {
    const runs = [];
    for (let x = 0; x < w; x++) {
      let y = 0;
      while (y < h) { if (!mask[y * w + x]) { y++; continue; } const y0 = y; while (y < h && mask[y * w + x]) y++; runs.push(y - y0); }
    }
    runs.sort((a, b) => a - b);
    return runs.length ? runs[Math.floor(runs.length * 0.1)] : 0;
  }

  /** 'auto' (the product's seat-aware strokes), 0 (as drawn), or a growth cap in seats. */
  const strokeOf = (g) => (g === 'auto' ? MAX_GROW_ROWS : g);

  /** The words as a layer `rows` letters tall: its grid size, as the editor makes it. */
  function layerFor(text, fontCss, glyphRows) {
    const r = renderTextCanvas(text, fontCss, 0);
    if (!r) return null;
    const scale = (glyphRows * EDITOR_UNITS.rowPx) / r.glyphHeight;
    const width = r.canvas.width * scale, height = r.canvas.height * scale;
    return { r, width, height, ...gridSize({ width, height }) };
  }

  /**
   * One face, one word, one height: the seats it makes (thickened as given),
   * against the face as drawn at 128px.
   * grow: 'auto' (the product rule), a number of rows a side, or 0.
   */
  window.__measure = (f, text, glyphRows, grow) => {
    const fontCss = cssFor(f);
    const L = layerFor(text, fontCss, glyphRows);
    if (!L) return null;
    const gr = strokeOf(grow);
    const mask = drawSeatAlpha(text, fontCss, 0, L.cols, L.rows, gr);
    // The face as drawn: its alpha at 128px.
    const c = L.r.canvas, W = c.width, H = c.height;
    const a = c.getContext('2d').getImageData(0, 0, W, H).data;
    const hi = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) hi[i] = a[i * 4 + 3] >= 128 ? 1 : 0;
    const gh = L.r.glyphHeight;
    // Specks under 2% of the letter height squared are antialiasing, not the
    // face; counters are asked for once they are two cells' worth of pixels.
    const cell = (W / L.cols) * (H / L.rows);
    const cmp = compare(hi, W, H, mask, L.cols, L.rows, (0.02 * gh) ** 2, 2 * cell);
    const fr = fragile(mask, L.cols, L.rows);
    // The thinnest stroke as drawn, as a share of the letter height.
    const thinHi = thinUp(hi, W, H) / gh;
    return {
      cols: L.cols, rows: L.rows,
      ...cmp,
      fragile: fr.painted ? fr.fragile / fr.painted : 1,
      thin: thinShare(mask, L.cols, L.rows),
      painted: fr.painted,
      thinRows: thinUp(mask, L.cols, L.rows),
      thinHi,
      grow: gr,
    };
  };

  // ---- the real stand -------------------------------------------------------
  const maps = new Map();
  const mapFor = (id) => { if (!maps.has(id)) maps.set(id, generateSeatMap(templateById(id))); return maps.get(id); };
  /** A stand's seats (one tier, one side): their editor box and rows. */
  function standOf(map, tier, stand) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const rows = new Set();
    const seats = [];
    // The east stand straddles the seam (u = 0): its far half is drawn left of 0.
    const W = EDITOR_UNITS.width;
    const xOf = (i) => { const x = map.xy[i * 2]; return stand === 0 && x > W / 2 ? x - W : x; };
    for (let i = 0; i < map.count; i++) {
      if (map.tierOf[i] !== tier || standIndexOfU(map.uv[i * 2]) !== stand) continue;
      seats.push(i);
      const x = xOf(i), y = map.xy[i * 2 + 1];
      if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      rows.add(map.rowOf[i]);
    }
    return { seats, minX, maxX, minY, maxY, rows: rows.size, xOf };
  }

  /**
   * Words on a real stand, as seats: the layer centred on the stand, as tall
   * as `fill` of its rows allows and as wide as its seats. Returns a PNG of
   * the stand's seats (each card drawn as itself) and the letter height used.
   * noShow: the share of cards nobody holds up (drawn as empty seats).
   */
  window.__onStand = (f, text, stadium, tier, stand, opt = {}) => {
    const map = mapFor(stadium);
    const S = standOf(map, tier, stand);
    const fontCss = cssFor(f);
    const fill = opt.fill ?? 0.72;
    let glyphRows = opt.glyphRows ?? Math.max(4, Math.floor(S.rows * fill));
    let L = layerFor(text, fontCss, glyphRows);
    const standW = (S.maxX - S.minX) * 0.92;
    if (!opt.glyphRows && L.width > standW) { glyphRows = Math.max(4, Math.floor(glyphRows * standW / L.width)); L = layerFor(text, fontCss, glyphRows); }
    const gr = strokeOf(opt.grow ?? 'auto');
    const alpha = drawSeatAlpha(text, fontCss, 0, L.cols, L.rows, gr);
    const grid = { cols: L.cols, rows: L.rows, data: Int16Array.from(alpha, (v) => (v ? 2 : -1)) };
    const p = { cx: (S.minX + S.maxX) / 2, cy: (S.minY + S.maxY) / 2, width: L.width, height: L.height, rotation: 0 };
    const set = new Set(S.seats);
    const st = stampObject(map, p, grid, null, EDITOR_UNITS.width, (i) => set.has(i), null);
    const ink = new Uint8Array(map.count);
    for (let j = 0; j < st.seats.length; j++) ink[st.seats[j]] = 1;
    // Draw: a seat is 3.2 x 8 units; k px a unit.
    const k = opt.k ?? 1;
    const pad = 6;
    // Cropped: the words and a margin round them, not the whole stand.
    const box = opt.crop
      ? { minX: Math.max(S.minX, p.cx - L.width * 0.53), maxX: Math.min(S.maxX, p.cx + L.width * 0.53), minY: Math.max(S.minY, p.cy - L.height * 0.5 - 16), maxY: Math.min(S.maxY, p.cy + L.height * 0.5 + 16) }
      : S;
    const W = Math.ceil((box.maxX - box.minX + 3.2) * k) + pad * 2, H = Math.ceil((box.maxY - box.minY + 8) * k) + pad * 2;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#3a3f4a'; g.fillRect(0, 0, W, H);
    const field = opt.field ?? '#c8102e', inkC = opt.ink ?? '#f4f1e8', empty = '#30343c';
    const sw = Math.max(1, 3.2 * k - (k >= 1 ? 0.6 : 0)), sh = Math.max(1, 8 * k - (k >= 1 ? 1 : 0));
    let h = 2166136261;
    const rnd = (i) => { let x = (i * 2654435761) ^ h; x ^= x >>> 15; x = Math.imul(x, 2246822507); x ^= x >>> 13; return ((x >>> 0) % 10000) / 10000; };
    for (const i of S.seats) {
      const sx = S.xOf(i), sy = map.xy[i * 2 + 1];
      if (sx < box.minX - 4 || sx > box.maxX + 4 || sy < box.minY - 8 || sy > box.maxY + 8) continue;
      const x = (sx - box.minX) * k + pad, y = (sy - box.minY) * k + pad;
      const off = opt.noShow && rnd(i) < opt.noShow;
      g.fillStyle = off ? empty : ink[i] ? inkC : field;
      g.fillRect(x, y, sw, sh);
    }
    return { png: cv.toDataURL('image/png'), glyphRows, standRows: S.rows, grow: gr, seats: st.seats.length };
  };

  /** The face as drawn, smooth, for the sheet's header. */
  window.__smooth = (f, text, h) => {
    const r = renderTextCanvas(text, cssFor(f), 0);
    const s = h / r.canvas.height;
    const cv = document.createElement('canvas'); cv.width = Math.ceil(r.canvas.width * s); cv.height = h;
    const g = cv.getContext('2d');
    g.fillStyle = '#c8102e'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(r.canvas, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/png');
  };
  window.__consts = { MAX_GROW_ROWS };

  /** A stand banner in the face, drawn by the product's banner renderer: an Arabic line over a Latin one. */
  window.__banner = async (f, ar, lat, bg, color) => {
    const doc = newBanner('stand', 'specimen');
    doc.bg = bg;
    const asp = aspectOf(doc);
    // Banner units (core/banner): the width is 1, y runs down to the aspect (height / width).
    const item = (text, cyFrac, hFrac) => {
      const r = renderTextCanvas(text, cssFor(f), 0);
      let h = hFrac * asp;
      const cy = cyFrac * asp;
      let w = h * (r.canvas.width / r.canvas.height);
      if (w > 0.92) { h *= 0.92 / w; w = 0.92; }
      return { id: `t${cy}`, kind: 'text', text, fontId: f.voice ?? f.id, arcDeg: 0, color, cx: 0.5, cy, w, h, rot: 0 };
    };
    doc.items = [item(ar, 0.34, 0.4), item(lat, 0.76, 0.3)];
    bannerToCanvas(doc, { maxEdge: 900 });
    await new Promise((r) => setTimeout(r, 1200));
    return bannerToCanvas(doc, { maxEdge: 900 }).toDataURL('image/png');
  };
  document.getElementById('out').textContent = 'ready';
  window.__ready = true;
</script></body></html>
