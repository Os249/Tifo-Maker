<!doctype html>
<!-- Dev-only harness for scripts/banner-shots.mts.

     Boots the REAL MatchDaySimulator, because the whole point is to see what
     the product draws. A harness that builds its own scene can render a
     beautiful banner while the app renders nothing, which is exactly what
     happened the last time this was a separate scene: every shot in the
     harness looked right and the banner in the product went through the
     terracing.

     It also returns a census and the rig's own penetration figure alongside
     the picture, because a screenshot cannot tell you a banner is two
     centimetres inside the concrete. -->
<html lang="en"><head><meta charset="UTF-8"/><title>banner shots</title></head>
<body style="margin:0;background:#05070c"><div id="out">loading…</div>
<script type="module">
  import { generateSeatMap } from '/src/core/seatmap.ts';
  import { DesignStore } from '/src/core/design.ts';
  import { templateById } from '/src/core/stadiumCatalog.ts';
  import { MatchDaySimulator } from '/src/render/simulator/index.ts';
  import { AssetStore } from '/src/core/sceneAssets.ts';
  import { BannerStore, newBanner } from '/src/core/banner.ts';

  const HOST = document.createElement('div');
  HOST.style.cssText = 'position:fixed;left:0;top:0;width:1280px;height:720px;';
  document.body.appendChild(HOST);

  window.__shoot = async (spec) => {
    HOST.replaceChildren();
    const template = templateById(spec.ground);
    const map = generateSeatMap(template);
    const store = new DesignStore(map, ['#0b1d4d', '#ffffff', '#f2c40f']);
    store.transform((i) => 1 + (i % 3));

    const banners = new BannerStore();
    const doc = {
      ...newBanner(spec.kind, 'shot'),
      wind: spec.wind ?? 0.25,
      slot: { stand: spec.stand, blockFrom: spec.from, blockSpan: spec.span, tier: spec.tier },
      // Something with a hard edge, a centre and a word on it, so a banner
      // that is stretched, mirrored or upside down is obvious rather than
      // plausible. A plain colour field looks correct in every orientation.
      bg: '#101a3a',
      items: (() => {
        const a = spec.aspect ?? 0.5;
        return [
          { id: 'f', kind: 'shape', shape: 'rect', cx: 0.5, cy: a / 2, w: 0.94, h: a - 0.06, rot: 0,
            color: '#101a3a', outline: 0.012, outlineColor: '#f2c40f' },
          { id: 'c', kind: 'shape', shape: 'circle', cx: 0.5, cy: a * 0.62, w: a * 0.4, h: a * 0.4, rot: 0,
            color: '#f2c40f' },
          { id: 't', kind: 'text', text: spec.label ?? 'TIFO', cx: 0.5, cy: a * 0.24,
            w: 0.8, h: a * 0.26, rot: 0, fontId: 'poster', arcDeg: 0, color: '#ffffff' },
        ];
      })(),
    };
    if (spec.aspect != null) doc.aspect = spec.aspect;
    banners.add(doc);

    const sim = new MatchDaySimulator(HOST, map, store, template, new AssetStore(), {
      quality: 'high', bannerStore: banners,
    });
    sim.setTimeOfDay(spec.tod ?? 'day');
    sim.setFloodlights(spec.tod === 'night');
    const id = banners.list()[0].id;
    window.__lastFocus = null;
    sim.setBannerProgress(id, spec.progress ?? 1);
    const focused = sim.focusBanner(id, spec.elevationDeg);

    sim.start();
    await new Promise((r) => setTimeout(r, 420));
    sim.settleBanners(0.5);
    sim.stop();
    const png = sim.canvas.toDataURL('image/png');
    const out = {
      png,
      census: sim.bannerCensus(),
      penetration: sim.worstBannerPenetration(),
      bounds: sim.bannerBounds(id),
      focused,
      cam: [sim.camera.position.x, sim.camera.position.y, sim.camera.position.z],
    };
    sim.dispose();
    return out;
  };
  document.getElementById('out').textContent = 'ready';
  window.__ready = true;
</script></body></html>
