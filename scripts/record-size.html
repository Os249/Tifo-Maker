<!doctype html>
<!-- Dev-only harness for scripts/record-size.mts. Boots the real simulator and
     actually records, because a size budget is a claim about what comes out of
     MediaRecorder and the only way to check it is to run MediaRecorder. -->
<html lang="en"><head><meta charset="UTF-8"/><title>record size</title></head>
<body style="margin:0;background:#05070c"><div id="out">loading…</div>
<script type="module">
  import { generateSeatMap } from '/src/core/seatmap.ts';
  import { DesignStore } from '/src/core/design.ts';
  import { templateById } from '/src/core/stadiumCatalog.ts';
  import { MatchDaySimulator, RECORD_MAX_BYTES } from '/src/render/simulator/index.ts';
  import { AssetStore } from '/src/core/sceneAssets.ts';

  const HOST = document.createElement('div');
  HOST.style.cssText = 'position:fixed;left:0;top:0;width:1280px;height:720px;';
  document.body.appendChild(HOST);

  let sim = null;
  window.__boot = (id) => {
    HOST.replaceChildren();
    const template = templateById(id);
    const map = generateSeatMap(template);
    const store = new DesignStore(map, ['#0b1d4d', '#ffffff', '#f2c40f', '#c0392b']);
    // A busy design on purpose. A flat two-colour bowl compresses to almost
    // nothing and would let the budget pass on content nobody will ever make.
    store.transform((i) => 1 + (i % 3));
    sim = new MatchDaySimulator(HOST, map, store, template, new AssetStore(), { quality: 'high' });
    sim.setTimeOfDay('night');
    sim.setFloodlights(true);
    sim.setSmoke(true);
    sim.start();
    return { budget: RECORD_MAX_BYTES, canvas: [sim.canvas.width, sim.canvas.height] };
  };

  window.__record = async (opts) => {
    const t0 = performance.now();
    const clip = await sim.recordReveal(opts);
    if (!clip) return { unsupported: true };
    // Read the container's own header rather than trusting the extension. An MP4
    // starts with a 4-byte size then the ASCII 'ftyp' box and its brands; a WebM
    // starts with the EBML magic 1A 45 DF A3. This is the only way to tell that
    // a file named .mp4 really is one.
    const head = new Uint8Array(await clip.blob.slice(0, 32).arrayBuffer());
    const ascii = String.fromCharCode(...head).replace(/[^\x20-\x7e]/g, '.');
    return {
      bytes: clip.blob.size,
      mime: clip.mimeType,
      extension: clip.extension,
      universal: clip.universal,
      magic: Array.from(head.slice(0, 4)).map((b) => b.toString(16).padStart(2, '0')).join(''),
      ftyp: ascii.slice(4, 8),
      brands: ascii.slice(8, 32),
      wallMs: Math.round(performance.now() - t0),
    };
  };

  window.__teardown = () => { sim?.dispose(); sim = null; };
  document.getElementById('out').textContent = 'ready';
  window.__ready = true;
</script></body></html>
