<!doctype html>
<html lang="en">
<head>
  <!-- Colour scheme, before anything paints: an explicit choice wins, otherwise the device decides. -->
  <script src="/theme-boot.js"></script>
  <meta name="theme-color" content="#FBFAFF" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title data-i18n="pj.docTitle">My projects · TifoMaker</title>
  <!-- Someone's own list. Nothing here is for a search engine. -->
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">Skip to main content</a>
  <header class="nav">
    <a class="brand" href="/" dir="ltr">TIFO<b>MAKER</b></a>
    <nav class="nav-links">
      <a href="/projects" class="active" aria-current="page" data-i18n="nav.projects">My projects</a>
      <a href="/community" data-i18n="nav.community">Community</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark mode" title="Dark mode"><svg class="ic-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg><svg class="ic-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <button class="lang-toggle" id="lang-toggle" data-i18n="common.language">العربية</button>
      <button class="nav-cta" id="auth-btn" data-i18n="ed.signup">Sign in</button>
    </nav>
  </header>

  <main class="pj" id="main" tabindex="-1">
    <section class="pj-head">
      <div class="pj-title-row">
        <h1 id="pj-h" data-i18n="pj.title">My projects</h1>
        <button type="button" class="pj-new" id="pj-new">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="pj.new">New project</span>
        </button>
      </div>
      <!-- Where these live, said plainly. For a guest it is this browser only,
           and the page says so rather than letting them find out. -->
      <p class="pj-where" id="pj-where" hidden></p>
      <div class="pj-controls" id="pj-controls" hidden>
        <div class="pj-search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="pj-search" placeholder="Search your projects" data-i18n-attr="placeholder:pj.search,aria-label:pj.search" aria-label="Search your projects" autocomplete="off" />
        </div>
        <label class="pj-sort">
          <span class="pj-sr" data-i18n="pj.sortLabel">Sort projects</span>
          <select id="pj-sort">
            <option value="edited" data-i18n="pj.sort.edited">Last edited</option>
            <option value="created" data-i18n="pj.sort.created">Newest</option>
            <option value="name" data-i18n="pj.sort.name">Name</option>
          </select>
        </label>
        <span class="pj-spacer"></span>
        <button type="button" class="pj-ghost" id="pj-import">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
          <span data-i18n="pj.import">Import a .tifo file</span>
        </button>
        <button type="button" class="pj-ghost" id="pj-trash-btn" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          <span id="pj-trash-label">Trash</span>
        </button>
      </div>
      <p class="pj-trash-note" id="pj-trash-note" hidden></p>
    </section>

    <section class="pj-grid" id="pj-grid" aria-labelledby="pj-h"></section>
    <p class="pj-status" id="pj-status" role="status" aria-live="polite" data-i18n="pj.loading">Loading your projects…</p>

    <section class="pj-empty" id="pj-empty" hidden>
      <div class="pj-empty-art" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h2 data-i18n="pj.emptyTitle">Create your first project</h2>
      <p data-i18n="pj.emptyBody">Name it, pick a stadium, and start painting. Or describe what you want and let the AI draw it.</p>
      <div class="pj-empty-actions">
        <button type="button" class="pj-new" id="pj-empty-new"><span data-i18n="pj.new">New project</span></button>
        <button type="button" class="pj-ghost pj-ai" id="pj-empty-ai"><span aria-hidden="true">✦</span> <span data-i18n="np.ai">Generate with AI</span></button>
      </div>
    </section>
  </main>

  <div id="auth-mount"></div>

  <footer class="site-foot">
    <a href="/" data-i18n="clubs.footHome">Home</a>
    <a href="/legal#terms" data-i18n="nav.terms">Terms</a>
    <a href="/legal#privacy" data-i18n="nav.privacy">Privacy</a>
    <button type="button" class="fb-entry" id="foot-feedback" data-i18n="fb.entry">Feedback</button>
  </footer>

  <script type="module" src="/src/projects.ts"></script>
</body>
</html>
